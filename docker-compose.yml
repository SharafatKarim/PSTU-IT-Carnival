name: pstu-it-carnival

services:
  # ---- MongoDB ----------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: pstu-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---- Next.js Web App --------------------------------------------------
  web:
    build: .
    container_name: pstu-web
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-pstu_it_carnival}
      REGISTRATION_ID_PREFIX: ${REGISTRATION_ID_PREFIX:-PSTU-PC-2026}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
